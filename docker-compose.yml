# Ports publiés sur 127.0.0.1 par défaut (non visibles depuis le réseau).
# Sous WSL avec Docker Desktop, ces ports peuvent être injoignables depuis WSL :
# ajoutez alors DOCKER_BIND_ADDRESS=0.0.0.0 dans le .env.
services:
  # Plateforme complète : `docker compose up -d --build`, puis http://localhost:8080
  web:
    build: ./apps/web
    container_name: interview-web
    restart: unless-stopped
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      - api

  api:
    build: ./apps/api
    container_name: interview-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379
      # Derrière le Nginx du front : l'IP du candidat est lue dans X-Forwarded-For
      TRUST_PROXY_HOPS: 1
      # Voix de Lina par Piper (gratuit). Une clé ElevenLabs ou OpenAI dans .env reste prioritaire en mode auto.
      PIPER_URL: http://piper:5000
      # Pocket TTS (profil « pocket ») : utilisé seulement avec TTS_PROVIDER=pocket
      POCKET_TTS_URL_FR: http://pocket-fr:8000
      POCKET_TTS_URL_EN: http://pocket-en:8000
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      redis:
        condition: service_healthy
      piper:
        condition: service_healthy

  # Synthèse vocale locale et gratuite (voix du catalogue https://piperhub.org)
  piper:
    build:
      context: ./apps/piper
      args:
        # Voix officielles téléchargées à la construction (ajoutez-en séparées par un espace)
        PIPER_VOICES: ${PIPER_VOICES:-fr_FR-siwis-medium en_US-hfc_female-medium}
    container_name: interview-piper
    restart: unless-stopped
    environment:
      PIPER_DEFAULT_VOICE: ${PIPER_VOICE_FR:-fr_FR-siwis-medium}
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:5000:5000"
    volumes:
      # Voix PiperHub ajoutées à la main (.onnx + .onnx.json)
      - ./apps/piper/voices:/voices/custom:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/voices', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Pocket TTS (Kyutai) : voix plus naturelles, en option (plus lourd que Piper).
  # Activer : TTS_PROVIDER=pocket dans le .env, puis : docker compose --profile pocket up -d
  pocket-fr:
    profiles: [pocket]
    build: ./apps/pocket-tts
    image: interview-dev-pocket-tts
    container_name: interview-pocket-fr
    restart: unless-stopped
    environment:
      POCKET_LANGUAGE: french
      POCKET_VOICE: ${POCKET_TTS_VOICE_FR:-estelle}
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:8001:8000"
    cpus: 2

  pocket-en:
    profiles: [pocket]
    build: ./apps/pocket-tts
    image: interview-dev-pocket-tts
    container_name: interview-pocket-en
    restart: unless-stopped
    depends_on:
      - pocket-fr
    environment:
      POCKET_LANGUAGE: english
      POCKET_VOICE: ${POCKET_TTS_VOICE_EN:-alba}
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:8002:8000"
    cpus: 2

  db:
    image: postgres:16
    container_name: interview-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-interview}
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-interview}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: interview-redis
    restart: unless-stopped
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
  redis_data:
